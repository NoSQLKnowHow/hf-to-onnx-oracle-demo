# Never put a password here in this file.

# SETTINGS TO REVIEW FIRST
# Database connection: use a TNS alias from your wallet.
database.user = "ADMIN"
database.dsn = "database-name_low"

# Hugging Face model and the name used for the exported database model.
model.id = "nomic-ai/nomic-embed-text-v1.5"
# Base name for database models and exported files. File names add _ONNX;
# quantized versions add _INT8 to both the database and file names.
model.name = "NOMIC_EMBED_TEXT_V15"
model.quantize = false
model.output_dir = "."
model.max_tokens = 512
model.dimensions = 768

# Choose which model versions to compare. Both names use model.name;
# the quantized model name adds _INT8.
comparison.include_unquantized = true
comparison.include_quantized = false # Enable after importing the _INT8 model.

# OTHER SETTINGS
# Review these when choosing a different model or changing the export behavior.
model.external_data = true # This setting enables memory sharing once the model is in an Oracle database.
model.distance_metrics = ["COSINE"]
model.do_lower_case = true
model.post_processors = [{ name = "Pooling", type = "mean" }, { name = "Normalize" }]
model.languages = []
model.use_float16 = false
model.query = "search_query: How do I find documents by meaning?"

# Reference settings for comparing Nomic embeddings.
comparison.tokenizer_id = "bert-base-uncased"
comparison.trust_remote_code = true # Reference loading executes Nomic custom code for transformers.
comparison.code_revision = "7710840340a098cfb869c4f65e87cf2b1b70caca"
comparison.query_case = "query_short"
comparison.document_cases = ["document_short", "document_unrelated", "document_medium"]

# Example texts can be replaced with representative queries and documents.
[[cases]]
name = "query_short"
text = "search_query: How do I find documents by meaning?"

[[cases]]
name = "document_short"
text = "search_document: Vector search finds documents with related meanings."

[[cases]]
name = "document_unrelated"
text = "search_document: A recipe for baking a loaf of bread."

[[cases]]
name = "query_case"
text = "search_query: How does Oracle Database handle AI Vector Search?"

[[cases]]
name = "document_medium"
prefix = "search_document: "
repeat_text = "Oracle Database can store embeddings and use vector search to find related documents. "
repeat = 20

[[cases]]
name = "document_near_limit"
prefix = "search_document: "
repeat_text = "vector search "
repeat = 245

[[cases]]
name = "document_over_limit"
prefix = "search_document: "
repeat_text = "vector search "
repeat = 270
