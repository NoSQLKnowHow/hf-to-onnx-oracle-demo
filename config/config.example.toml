# Copy to config/config.toml and edit that file. Never put a password here.
[database]
user = "ADMIN"
dsn = "database-name_low" # Replace with your wallet's TNS alias.

[model]
id = "nomic-ai/nomic-embed-text-v1.5"
name = "NOMIC_EMBED_TEXT_V15_ONNX" # Adds _INT8 when quantize is true.
quantize = false
external_data = true
output_dir = "."
max_tokens = 512
dimensions = 768
distance_metrics = ["COSINE"]
query = "search_query: How do I find documents by meaning?"

[comparison]
# Set either model name to an empty string to skip it.
unquantized_model = "NOMIC_EMBED_TEXT_V15_ONNX"
quantized_model = "NOMIC_EMBED_TEXT_V15_ONNX_INT8"
tokenizer_id = "bert-base-uncased"
code_revision = "7710840340a098cfb869c4f65e87cf2b1b70caca"
query_case = "query_short"
document_cases = ["document_short", "document_unrelated", "document_medium"]

[[cases]]
name = "query_short"
text = "search_query: How do I find documents by meaning?"

[[cases]]
name = "document_short"
text = "search_document: Vector search finds documents with related meanings."

[[cases]]
name = "document_unrelated"
text = "search_document: A recipe for baking a loaf of bread."

[[cases]]
name = "query_case"
text = "search_query: How does Oracle Database handle AI Vector Search?"

[[cases]]
name = "document_medium"
prefix = "search_document: "
repeat_text = "Oracle Database can store embeddings and use vector search to find related documents. "
repeat = 20

[[cases]]
name = "document_near_limit"
prefix = "search_document: "
repeat_text = "vector search "
repeat = 245

[[cases]]
name = "document_over_limit"
prefix = "search_document: "
repeat_text = "vector search "
repeat = 270
